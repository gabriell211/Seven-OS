# Seven Windows compatibility defaults.
SEVEN_WINDOWS_ENABLED=1
SEVEN_WINDOWS_PREFIX_ROOT=
SEVEN_WINDOWS_WINE_BINARY=wine
SEVEN_WINDOWS_DEBUG=-all

# Leave empty for new prefixes. Wine 11 creates a 64-bit prefix by default
# and its new WoW64 runtime handles both Win64 and Win32 applications.
# Set to wow64 only when explicitly forcing an existing 64-bit prefix into
# Wine 11's new WoW64 mode.
SEVEN_WINDOWS_ARCH=
