# Seven OS Windows compatibility handlers.
# Windows PE executables start with the MZ magic signature.
:seven-pe:M::MZ::/usr/bin/seven-winexec:

# MSI packages are OLE compound files, so route them by extension.
:seven-msi:E::msi::/usr/bin/seven-winexec:
:seven-msi-upper:E::MSI::/usr/bin/seven-winexec:
