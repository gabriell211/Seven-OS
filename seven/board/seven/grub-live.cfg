set default=0
set timeout=4

menuentry "Seven OS Live" {
    linux /boot/seven-kernel rdinit=/sbin/init seven.live=1 quiet loglevel=3
    initrd /boot/seven-initramfs.cpio.gz
}

menuentry "Seven OS Live - Recovery" {
    linux /boot/seven-kernel rdinit=/sbin/init seven.live=1 seven.recovery=1 systemd.unit=rescue.target loglevel=6
    initrd /boot/seven-initramfs.cpio.gz
}

menuentry "Seven OS Live - Diagnostics" {
    linux /boot/seven-kernel rdinit=/sbin/init seven.live=1 systemd.unit=multi-user.target loglevel=7
    initrd /boot/seven-initramfs.cpio.gz
}
