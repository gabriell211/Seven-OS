set default=0
set timeout=4

menuentry "Seven OS Live" {
	linux /boot/seven-kernel rdinit=/sbin/init seven.live=1
	initrd /boot/seven-initramfs.cpio.gz
}

menuentry "Seven OS Live - Recovery" {
	linux /boot/seven-kernel rdinit=/sbin/init seven.live=1 seven.recovery=1
	initrd /boot/seven-initramfs.cpio.gz
}
