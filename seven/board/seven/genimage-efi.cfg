image seven-efi.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}

		file seven-kernel {
			image = "seven-kernel"
		}
	}

	size = 64M
}

image seven-os.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition esp {
		image = "seven-efi.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}

	partition root {
		image = "rootfs.ext2"
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
	}
}
