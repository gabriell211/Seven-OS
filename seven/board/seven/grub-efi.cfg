set default="0"
set timeout="4"

menuentry "Seven OS" {
    linux /seven-kernel root=LABEL=SEVENROOT rootwait rw quiet loglevel=3
}

menuentry "Seven OS - Recovery" {
    linux /seven-kernel root=LABEL=SEVENROOT rootwait rw seven.recovery=1 systemd.unit=rescue.target loglevel=6
}

menuentry "Seven OS - Diagnostics" {
    linux /seven-kernel root=LABEL=SEVENROOT rootwait rw systemd.unit=multi-user.target loglevel=7
}
