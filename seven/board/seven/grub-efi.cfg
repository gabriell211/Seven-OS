set default="0"
set timeout="3"

menuentry "Seven OS" {
    search --no-floppy --label SEVENROOT --set=root
    linux /boot/seven-kernel root=LABEL=SEVENROOT rootwait rw quiet loglevel=3
}

menuentry "Seven OS (recovery)" {
    search --no-floppy --label SEVENROOT --set=root
    linux /boot/seven-kernel root=LABEL=SEVENROOT rootwait rw systemd.unit=rescue.target loglevel=6
}

menuentry "Seven OS (emergency shell)" {
    search --no-floppy --label SEVENROOT --set=root
    linux /boot/seven-kernel root=LABEL=SEVENROOT rootwait rw systemd.unit=emergency.target loglevel=7
}
